name = "hex-perm-group"
defaultTargets = ["HexPermGroup"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "v0.7.0"

[[lean_lib]]
name = "HexPermGroup"
precompileModules = true

[[lean_lib]]
name = "HexPermGroupTests"
globs = ["HexPermGroup.Tests", "HexPermGroup.CertificateTests", "HexPermGroup.ImportTests"]
