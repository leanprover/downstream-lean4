name: Create an adaptation PR

inputs:
  app-token:
    description: GitHub app token.
    required: true

  app-slug:
    description: GitHub app slug.
    required: true

  upstream-clone:
    description: >
      Path to a (potentially treeless) clone of the upstream repository. It must
      contain all refs that `ref-mapping` should consider. The upstream PR head
      is fetched by the action itself.
    required: true

  upstream-pr:
    description: >
      The upstream PR number to create the adaptation PR for.
    required: true

  upstream-ci-green:
    description: >
      Whether the upstream PR CI is considered green. If it is not green, the
      action will not attempt to create an adaptation PR.
    default: true

  upstream-ci-green-msg:
    description: >
      Message to display in the upstream PR when waiting for the upstream CI to
      turn green.
    default: >
      The adaptation PR will be created or updated once CI is green.

  ref-mapping:
    description: >
      Mapping from upstream refs to the downstream refs they correspond to, one
      per line, of the form `pattern -> replacement`. The pattern is matched
      against the full name of the refs from the upstream repo, e.g.
      `refs/remotes/origin/downstream-green`. The replacement must also be full,
      e.g. `refs/remotes/origin/green`, and is looked up in the downstream repo.

      The upstream ref closest to the upstream PR's merge base determines the
      downstream ref the adaptation PR is based on. If multiple upstream refs
      point to the same commit, earlier lines in this mapping take precedence.
      Unless the `upstream-label-force` is used, the ref must point exactly to
      the merge base and ancestors are not considered.
    default: |
      refs/remotes/origin/downstream-green -> refs/remotes/origin/green

  ref-mapping-desc:
    description: >
      Plain language description of the upstream refs in `ref-mapping`, used in
      messages to the upstream PR. It should fit into the sentence "The merge
      base of this PR does not coincide with <ref-mapping-desc>."
    default: >
      branch `downstream-green`

  upstream-label:
    description: >
      Label to add to an upstream PR to trigger adaptation PR creation.
    default: downstream

  upstream-label-force:
    description:
      Label to add to an upstream PR to force adaptation PR creation, even where
      `upstream-label` would normally just leave a message.

  downstream-repo:
    description: >
      The downstream repository to search for adaptation PRs and dispatch the
      downstream action in, in "owner/repo" format.
    required: true

  downstream-clone:
    description: >
      Path to a (potentially treeless) clone of the downstream repository. It
      must contain all refs that `ref-mapping` may map to.
    required: true

  downstream-label:
    description: >
      Label to attach to all adaptation PRs created by this action. Must match
      the label configured by the adaptation-pr-merge action.
    default: adaptation

  downstream-label-merge:
    description: >
      Label that is attached to all adaptation PRs that could not be merged
      automatically. Must match the label applied by the adaptation-pr-merge
      action.
    default: merge-required

  override-toolchain:
    description: >
      Override the toolchain in the adaptation PR with this value. If not set,
      the toolchain will not be modified.

  # TODO Support repo overrides

outputs:
  number:
    description: >
      The adaptation PR number, if one exists or was created.

runs:
  using: node24
  main: dist/index.js
