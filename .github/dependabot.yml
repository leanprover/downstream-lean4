version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      # Minor and patch bumps land together in one PR. Major bumps get one PR
      # each, since they can change inputs or runtime requirements.
      actions-minor-patch:
        update-types:
          - minor
          - patch
