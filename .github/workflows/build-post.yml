name: Post-build

on:
  workflow_run:
    workflows: [Build subrepos]
    types: [completed]

concurrency:
  group: build-post-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  upload-cache:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    env:
      LAKE_ARTIFACT_CACHE: 1
      LAKE_CONFIG: ${{ github.workspace }}/.meta/lake-config.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set cache directory
        run: echo "LAKE_CACHE_DIR=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"

      - name: Download build mappings
        uses: actions/download-artifact@v8
        with:
          name: build-mappings
          path: ${{ runner.temp }}/mappings
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download build cache
        uses: actions/download-artifact@v8
        with:
          name: build-cache
          path: ${{ runner.temp }}/cache
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Upload artifacts to cache
        env:
          LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
        run: |
          .downstream/list.py . | while IFS= read -r repo; do
            echo "::group::cache put $repo"
            ( cd "$repo" && lake cache put --scope "$repo" "$RUNNER_TEMP/mappings/$repo.jsonl" ) || true
            echo "::endgroup::"
          done

  post-report-pr:
    if:
      ${{ github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'master' }}
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Find original PR
        id: original-pr
        uses: ./.downstream/actions/find-original-pr

      - name: Download build report
        uses: actions/download-artifact@v8
        with:
          name: build-report
          path: ${{ runner.temp }}/report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Render report
        uses: ./.downstream/actions/render-report
        with:
          build-report-path: ${{ runner.temp }}/report/build-report.json
          report-type: compact
          output-path: ${{ runner.temp }}/report/report.md
          run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}

      - name: Post build report to PR
        uses: ./.downstream/actions/status-message
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          issue: ${{ steps.original-pr.outputs.number }}
          body-path: ${{ runner.temp }}/report/report.md
          marker: build-report

  post-report-zulip:
    if:
      ${{ github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-slim
    permissions:
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build report
        uses: actions/download-artifact@v8
        with:
          name: build-report
          path: ${{ runner.temp }}/report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Render report
        id: build-report
        uses: ./.downstream/actions/render-report
        with:
          build-report-path: ${{ runner.temp }}/report/build-report.json
          report-type: compact
          report-style: zulip
          run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}

      - name: Post build report to Zulip
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ${{ vars.ZULIP_EMAIL }}
          organization-url: "https://leanprover.zulipchat.com"
          type: stream
          to: ecosystem infrastructure
          topic: downstream-lean4 build reports
          content: ${{ steps.build-report.outputs.report }}

  update-branches:
    if:
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-slim
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}
          repositories: lean4,downstream-lean4

      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine nightly name
        id: nightly
        run: |
          if NIGHTLY="$(grep -P '(?<=leanprover/lean4:)nightly-.*' lean-toolchain -o)"; then
            echo "::notice::Found nightly $NIGHTLY in lean-toolchain"
            echo "nightly=$NIGHTLY" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to derive nightly from lean-toolchain"
            exit 1
          fi

      - name: Update green-nightly-YYYY-MM-DD branch
        uses: ./.github/actions/update-branch
        with:
          token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          branch: green-${{ steps.nightly.outputs.nightly }}
          sha: ${{ github.sha }}

      - name: Update green branch
        uses: ./.github/actions/update-branch
        with:
          token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          branch: green
          sha: ${{ github.sha }}

      - name: Determine lean4 nightly sha
        id: lean4-nightly
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ steps.nightly.outputs.nightly }}
        run: |
          if SHA="$(gh api "repos/leanprover/lean4-nightly/git/ref/tags/$NIGHTLY" -q '.object.sha')"; then
            echo "::notice::Resolved lean4 $NIGHTLY to $SHA"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to resolve lean4 $NIGHTLY to a commit"
            exit 1
          fi

      - name: Update lean4 downstream-green branch
        uses: ./.github/actions/update-branch
        with:
          token: ${{ steps.app-token.outputs.token }}
          repo: leanprover/lean4
          branch: downstream-green
          sha: ${{ steps.lean4-nightly.outputs.sha }}
