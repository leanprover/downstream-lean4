name: Post-build on master

on:
  workflow_run:
    workflows: [Build subrepos]
    types: [completed]
    branches: [master]

concurrency:
  group: build-post
  cancel-in-progress: false

jobs:
  main:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-slim
    environment: master
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine nightly name
        id: nightly
        run: |
          if NIGHTLY="$(grep -P '(?<=leanprover/lean4:)nightly-.*' lean-toolchain -o)"; then
            echo "::notice::Found nightly $NIGHTLY in lean-toolchain"
            echo "nightly=$NIGHTLY" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to derive nightly from lean-toolchain"
            exit 1
          fi

      - name: Update nightly-YYYY-MM-DD branch
        uses: ./.github/actions/update-branch
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          repo: ${{ github.repository }}
          branch: ${{ steps.nightly.outputs.nightly }}
          sha: ${{ github.sha }}

      - name: Update nightly-latest branch
        uses: ./.github/actions/update-branch
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          repo: ${{ github.repository }}
          branch: nightly-latest
          sha: ${{ github.sha }}

      - name: Determine lean4 nightly sha
        id: lean4-nightly
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ steps.nightly.outputs.nightly }}
        run: |
          if SHA="$(gh api "repos/leanprover/lean4-nightly/git/ref/tags/$NIGHTLY" -q '.object.sha')"; then
            echo "::notice::Resolved lean4 $NIGHTLY to $SHA"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to resolve lean4 $NIGHTLY to a commit"
            exit 1
          fi

      - name: Update lean4 downstream branch
        uses: ./.github/actions/update-branch
        with:
          token: ${{ secrets.PUSH_LEAN4_TOKEN }}
          repo: leanprover/lean4
          branch: downstream
          sha: ${{ steps.lean4-nightly.outputs.sha }}
