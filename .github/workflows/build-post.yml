name: Post-build on master

on:
  workflow_run:
    workflows: [Build subrepos]
    types: [completed]
    branches: [master]

concurrency:
  group: build-post
  cancel-in-progress: false

jobs:
  main:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-slim
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}
          repositories: lean4,downstream-lean4

      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine nightly name
        id: nightly
        run: |
          if NIGHTLY="$(grep -P '(?<=leanprover/lean4:)nightly-.*' lean-toolchain -o)"; then
            echo "::notice::Found nightly $NIGHTLY in lean-toolchain"
            echo "nightly=$NIGHTLY" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to derive nightly from lean-toolchain"
            exit 1
          fi

      - name: Update green-nightly-YYYY-MM-DD branch
        uses: ./.github/actions/update-branch
        with:
          token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          branch: green-${{ steps.nightly.outputs.nightly }}
          sha: ${{ github.sha }}

      - name: Update green branch
        uses: ./.github/actions/update-branch
        with:
          token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          branch: green
          sha: ${{ github.sha }}

      - name: Determine lean4 nightly sha
        id: lean4-nightly
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ steps.nightly.outputs.nightly }}
        run: |
          if SHA="$(gh api "repos/leanprover/lean4-nightly/git/ref/tags/$NIGHTLY" -q '.object.sha')"; then
            echo "::notice::Resolved lean4 $NIGHTLY to $SHA"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to resolve lean4 $NIGHTLY to a commit"
            exit 1
          fi

      - name: Update lean4 downstream-green branch
        uses: ./.github/actions/update-branch
        with:
          token: ${{ steps.app-token.outputs.token }}
          repo: leanprover/lean4
          branch: downstream-green
          sha: ${{ steps.lean4-nightly.outputs.sha }}
