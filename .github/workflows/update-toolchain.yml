name: Update toolchain

on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:

concurrency:
  group: update-toolchain
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-slim
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          filter: tree:0
          fetch-depth: 0

      - name: Configure git
        uses: ./.downstream/actions/configure-git
        with:
          name: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Find latest nightly release
        id: find-nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NIGHTLY_TAG="$(gh api repos/leanprover/lean4-nightly/releases?per_page=1 -q '.[0].tag_name')"
          echo "::notice::Found nightly tag $NIGHTLY_TAG"
          echo "nightly-tag=$NIGHTLY_TAG" >> "$GITHUB_OUTPUT"
          NIGHTLY_SHA="$(gh api repos/leanprover/lean4-nightly/commits/"$NIGHTLY_TAG" -q '.sha')"
          echo "::notice::Resolved nightly tag $NIGHTLY_TAG to $NIGHTLY_SHA"
          echo "nightly-sha=$NIGHTLY_SHA" >> "$GITHUB_OUTPUT"

      - name: Update toolchain
        id: update-toolchain
        env:
          NIGHTLY_TAG: ${{ steps.find-nightly.outputs.nightly-tag }}
        run: |
          echo "leanprover/lean4:$NIGHTLY_TAG" > lean-toolchain
          git add lean-toolchain
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: bump toolchain to $NIGHTLY_TAG"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: fromJSON(steps.update-toolchain.outputs.changed)
        run: |
          git push origin HEAD:${{ github.ref_name }}

      - name: Merge adaptation PRs
        id: merge-adaptation-prs
        if: fromJSON(steps.update-toolchain.outputs.changed)
        uses: ./.downstream/actions/adaptation-pr-merge
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          upstream-repo: leanprover/lean4
          upstream-rev: ${{ steps.find-nightly.outputs.nightly-sha }}
          downstream-clone: .

      - name: Post unmerged PRs to Zulip
        if: ${{ steps.merge-adaptation-prs.outputs.report-zulip != '' }}
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ${{ vars.ZULIP_EMAIL }}
          organization-url: "https://leanprover.zulipchat.com"
          type: stream
          to: ecosystem infrastructure
          topic: downstream-lean4 adaptations
          content: |
            After the toolchain bump to `${{ steps.find-nightly.outputs.nightly-tag }}`, the following adaptation PRs could not be merged automatically:

            ${{ steps.merge-adaptation-prs.outputs.report-zulip }}

            View [all PRs requiring manual intervention](https://github.com/leanprover/downstream-lean4/pulls?q=is%3Aopen+is%3Apr+label%3Amerge-required).
