name: Update subrepos

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: update-subrepos
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-slim
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}

      - name: Configure git
        uses: .downstream/actions/configure-git
        with:
          name: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Update subrepos
        run: |
          python3 .downstream/update.py . -pU

      - name: Push
        run: |
          git push origin HEAD:${{ github.ref_name }}
