name: Build subrepos

on:
  push:
    branches:
      - "**"
      - "!green"
      - "!green-nightly-*"

jobs:
  main:
    runs-on: [self-hosted, chonk]
    env:
      LAKE_ARTIFACT_CACHE: 1
      LAKE_RESTORE_ARTIFACTS: 1
      LAKE_CONFIG: ${{ github.workspace }}/.meta/lake-config.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set cache directory
        run: echo "LAKE_CACHE_DIR=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"

      - name: Restore cache
        run: |
          TOOLCHAIN="$(cat lean-toolchain)"
          TOOLCHAIN="${TOOLCHAIN#leanprover/lean4:}"
          .downstream/list.py . | while IFS= read -r repo; do
            echo "::group::get $repo"
            pushd "$repo"
            lake cache get --scope "$TOOLCHAIN/$repo" || true
            popd
            echo "::endgroup::"
          done

      - name: Build
        run: |
          .downstream/build.py . -tl \
            --report "$RUNNER_TEMP/build-report.json" \
            --mappings "$RUNNER_TEMP/mappings"

      - name: Render report
        uses: ./.downstream/actions/render-report
        with:
          build-report-path: ${{ runner.temp }}/build-report.json
          output-path: ${{ runner.temp }}/report.md

      - name: Add report to job summary
        run: cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage cache
        run: |
          mkdir -p "$RUNNER_TEMP/staging"
          cp lean-toolchain "$RUNNER_TEMP/staging/"
          .downstream/list.py . | while IFS= read -r repo; do
            echo "::group::stage $repo"
            pushd "$repo"
            lake cache stage "$RUNNER_TEMP/mappings/$repo.jsonl" "$RUNNER_TEMP/staging/$repo/" || true
            popd
            echo "::endgroup::"
          done

      - name: Upload build report
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: ${{ runner.temp }}/build-report.json

      - name: Upload staged cache
        uses: actions/upload-artifact@v7
        with:
          name: build-staging
          path: ${{ runner.temp }}/staging/

      - name: Fail if critical repos are not green
        run: |
          if ! jq .green "$RUNNER_TEMP/build-report.json" -e > /dev/null; then
            echo "::error::At least one critical repo failed."
            exit 1
          fi
