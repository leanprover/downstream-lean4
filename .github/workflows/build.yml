name: Build subrepos

on:
  push:
    branches:
      - "**"
      - "!green"
      - "!green-nightly-*"

jobs:
  main:
    runs-on: [self-hosted, chonk]
    env:
      LAKE_ARTIFACT_CACHE: 1
      LAKE_RESTORE_ARTIFACTS: 1
      LAKE_CONFIG: ${{ github.workspace }}/.meta/lake-config.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set cache directory
        run: echo "LAKE_CACHE_DIR=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"

      - name: Restore cache
        run: |
          .downstream/list.py . | while IFS= read -r repo; do
            echo "::group::cache get $repo"
            ( cd "$repo" && lake cache get --scope "$repo" ) || true
            echo "::endgroup::"
          done

      - name: Build
        run: |
          .downstream/build.py . -tl \
            --report "$RUNNER_TEMP/report.json" \
            --mappings "$RUNNER_TEMP/mappings"

      - name: Render build report
        uses: ./.downstream/actions/build-report
        with:
          report-path: ${{ runner.temp }}/report.json
          output-path: ${{ runner.temp }}/report.md

      - name: Add report to job summary
        run: cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build report
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: ${{ runner.temp }}/report.json

      - name: Upload build mappings
        uses: actions/upload-artifact@v7
        with:
          name: build-mappings
          path: ${{ runner.temp }}/mappings/

      - name: Upload build cache
        uses: actions/upload-artifact@v7
        with:
          name: build-cache
          path: ${{ runner.temp }}/cache/

      - name: Fail if critical repos are not green
        run: |
          if ! jq .green "$RUNNER_TEMP/report.json" -e > /dev/null; then
            echo "::error::At least one critical repo failed."
            exit 1
          fi
