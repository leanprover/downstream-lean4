          run-id: ${{ github.event.workflow_run.id }}

      - name: Determine toolchain
        id: toolchain
        run: |
          TOOLCHAIN=$(jq .toolchain "${{ runner.temp }}/report/build-report.json" -r)
          TOOLCHAIN=${TOOLCHAIN#leanprover/lean4:}
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Create export PR
        id: export-pr
        uses: ./.downstream/actions/export-pr-create
        with:
          subrepo: cslib
          build-report-path: ${{ runner.temp }}/report/build-report.json
          downstream-clone: .
          tracking-branch: export/cslib
          push-repo: leanprover/cslib # TODO Obtain from repos.toml?
          push-branch: downstream-lean4-export
          target-repo: leanprover/cslib # TODO Obtain from repos.toml?
          target-branch: nightly-testing # TODO Obtain from repos.toml?
          target-token: ${{ steps.app-token.outputs.token }}
          pr-title: |-
            chore: downstream-lean4 adaptations for ${{ steps.toolchain.outputs.toolchain }}
          pr-body: >
            This PR contains the latest nightly adaptations from the
