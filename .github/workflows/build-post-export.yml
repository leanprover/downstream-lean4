name: Post-build export

on:
  workflow_run:
    workflows: [Build subrepos]
    types: [completed]

jobs:
  batteries:
    if:
      ${{ github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' }}
    concurrency:
      group: build-post-export/batteries
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    steps:
      - name: Create GitHub App token (leanprover organization)
        uses: actions/create-github-app-token@v3
        id: app-token-leanprover
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}
          repositories: downstream-lean4

      - name: Create GitHub App token (leanprover-community organization)
        uses: actions/create-github-app-token@v3
        id: app-token-leanprover-community
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}
          owner: leanprover-community
          repositories: batteries

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure git
        uses: ./.downstream/actions/configure-git
        with:
          name: ${{ steps.app-token-leanprover.outputs.app-slug }}[bot]

      - name: Download build report
        uses: actions/download-artifact@v8
        with:
          name: build-report
          path: ${{ runner.temp }}/report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Determine toolchain
        id: toolchain
        run: |
          TOOLCHAIN=$(jq .toolchain "${{ runner.temp }}/report/build-report.json" -r)
          TOOLCHAIN=${TOOLCHAIN#leanprover/lean4:}
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Create export PR
        id: export-pr
        uses: ./.downstream/actions/export-pr-create
        with:
          subrepo: batteries
          build-report-path: ${{ runner.temp }}/report/build-report.json
          downstream-path: ${{ runner.temp }}/downstream
          downstream-token: ${{ steps.app-token-leanprover.outputs.token }}
          tracking-branch: export/batteries
          push-repo: leanprover-community/batteries
          push-branch: nightly-testing
          push-token: ${{ steps.app-token-leanprover-community.outputs.token }}
          push-directly: true
          pr-title: |-
            chore: downstream-lean4 adaptations for ${{ steps.toolchain.outputs.toolchain }}

  mathlib4:
    if:
      ${{ github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' }}
    concurrency:
      group: build-post-export/mathlib4
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    steps:
      - name: Create GitHub App token (leanprover organization)
        uses: actions/create-github-app-token@v3
        id: app-token-leanprover
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}
          repositories: downstream-lean4,downstream-lean4-fork-mathlib4

      - name: Create GitHub App token (leanprover-community organization)
        uses: actions/create-github-app-token@v3
        id: app-token-leanprover-community
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}
          owner: leanprover-community
          repositories: mathlib4-nightly-testing

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure git
        uses: ./.downstream/actions/configure-git
        with:
          name: ${{ steps.app-token-leanprover.outputs.app-slug }}[bot]

      - name: Download build report
        uses: actions/download-artifact@v8
        with:
          name: build-report
          path: ${{ runner.temp }}/report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Determine toolchain
        id: toolchain
        run: |
          TOOLCHAIN=$(jq .toolchain "${{ runner.temp }}/report/build-report.json" -r)
          TOOLCHAIN=${TOOLCHAIN#leanprover/lean4:}
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Create export PR
        id: export-pr
        uses: ./.downstream/actions/export-pr-create
        with:
          subrepo: mathlib4
          build-report-path: ${{ runner.temp }}/report/build-report.json
          downstream-path: ${{ runner.temp }}/downstream
          downstream-token: ${{ steps.app-token-leanprover.outputs.token }}
          tracking-branch: export/mathlib4
          push-repo: leanprover-community/mathlib4-nightly-testing
          push-branch: nightly-testing
          push-token: ${{ steps.app-token-leanprover-community.outputs.token }}
          push-directly: true
          pr-title: |-
            chore: downstream-lean4 adaptations for ${{ steps.toolchain.outputs.toolchain }}

  cslib:
    if:
      ${{ github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' }}
    concurrency:
      group: build-post-export/cslib
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}
          repositories: downstream-lean4,cslib

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure git
        uses: ./.downstream/actions/configure-git
        with:
          name: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Download build report
        uses: actions/download-artifact@v8
        with:
          name: build-report
          path: ${{ runner.temp }}/report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Determine toolchain
        id: toolchain
        run: |
          TOOLCHAIN=$(jq .toolchain "${{ runner.temp }}/report/build-report.json" -r)
          TOOLCHAIN=${TOOLCHAIN#leanprover/lean4:}
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Create export PR
        id: export-pr
        uses: ./.downstream/actions/export-pr-create
        with:
          subrepo: cslib
          build-report-path: ${{ runner.temp }}/report/build-report.json
          downstream-path: ${{ runner.temp }}/downstream
          downstream-token: ${{ steps.app-token.outputs.token }}
          tracking-branch: export/cslib
          push-repo: leanprover/cslib
          push-branch: nightly-testing
          push-token: ${{ steps.app-token.outputs.token }}
          push-directly: true
          pr-title: |-
            chore: downstream-lean4 adaptations for ${{ steps.toolchain.outputs.toolchain }}
