name: Post-build export

on:
  workflow_run:
    workflows: [Build subrepos]
    types: [completed]

defaults:
  run:
    shell: bash # Implies -eo pipefail

jobs:
  export:
    name: ${{ matrix.subrepo }}
    if: |
      ${{ !contains(github.event.workflow_run.head_commit.message, 'skip-checks: true') &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # app-repos: leanprover repos the app token needs access to.
          # community-repos: leanprover-community repos to export to; if unset,
          # the leanprover token is used as the source token.
          - subrepo: batteries
            app-repos: downstream-lean4
            community-repos: batteries
            method: same-branch

          - subrepo: mathlib4
            app-repos: downstream-lean4,downstream-lean4-fork-mathlib4
            community-repos: mathlib4-nightly-testing
            method: same-branch

          - subrepo: cslib
            app-repos: downstream-lean4,cslib
            method: target-branch
            pr: true
            update-toolchains: true
            update-manifests: true
            lakefile-edits: |
              ^name = "mathlib"\nscope = "leanprover-community"\nrev = ".*"$ -> name = "mathlib"\ngit = "https://github.com/leanprover-community/mathlib4-nightly-testing"\nrev = "<mathlib4 sha>"
            zulip-stream: nightly-testing-cslib
    concurrency:
      group: build-post-export/${{ matrix.subrepo }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    steps:
      - name: Create GitHub App token (leanprover organization)
        uses: actions/create-github-app-token@v3
        id: app-token-leanprover
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.app-repos }}

      - name: Create GitHub App token (leanprover-community organization)
        if: ${{ matrix.community-repos }}
        uses: actions/create-github-app-token@v3
        id: app-token-leanprover-community
        with:
          client-id: ${{ vars.DOWNSTREAM_LEAN4_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_LEAN4_APP_PRIVATE_KEY }}
          owner: leanprover-community
          repositories: ${{ matrix.community-repos }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure git
        uses: ./.downstream/actions/configure-git
        with:
          name: ${{ steps.app-token-leanprover.outputs.app-slug }}[bot]

      - name: Download build report
        uses: actions/download-artifact@v8
        with:
          name: build-report
          path: ${{ runner.temp }}/report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Determine toolchain
        id: toolchain
        run: |
          TOOLCHAIN=$(jq .toolchain "${{ runner.temp }}/report/build-report.json" -r)
          TOOLCHAIN=${TOOLCHAIN#leanprover/lean4:}
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Install elan
        if: ${{ matrix.update-toolchains || matrix.update-manifests }}
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Optional inputs need explicit fallbacks: the action marks them as
      # required, so passing an empty string would fail.
      - name: Create export PR
        id: export-pr
        uses: ./.downstream/actions/export-pr-create
        with:
          subrepo: ${{ matrix.subrepo }}
          build-report-path: ${{ runner.temp }}/report/build-report.json
          clone-path: ${{ runner.temp }}/downstream
          method: ${{ matrix.method }}
          downstream-token: ${{ steps.app-token-leanprover.outputs.token }}
          source-token:
            ${{ steps.app-token-leanprover-community.outputs.token ||
            steps.app-token-leanprover.outputs.token }}
          pr: ${{ matrix.pr || false }}
          pr-title: |-
            chore: downstream-lean4 adaptations for ${{ steps.toolchain.outputs.toolchain }}
          update-toolchains: ${{ matrix.update-toolchains || false }}
          update-manifests: ${{ matrix.update-manifests || false }}
          lakefile-edits: ${{ matrix.lakefile-edits }}

      - name: Post message to Zulip
        if:
          ${{ matrix.zulip-stream && steps.export-pr.outputs.pr-created ==
          'true' }}
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ${{ vars.ZULIP_EMAIL }}
          organization-url: "https://leanprover.zulipchat.com"
          type: stream
          to: ${{ matrix.zulip-stream }}
          topic: downstream-lean4 PRs
          content: >
            PR ${{ matrix.subrepo }}#${{ steps.export-pr.outputs.pr-number }}
            with
            [downstream-lean4](https://github.com/leanprover/downstream-lean4)
            adaptations for `${{ steps.toolchain.outputs.toolchain }}` has just
            been opened. Please review the changes. No new adaptation PRs will
            be opened while this PR is still open.
