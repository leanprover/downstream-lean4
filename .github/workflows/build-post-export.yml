            repository.

      - name: Post message to Zulip
        if: ${{ fromJSON(steps.export-pr.outputs.created) }}
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ${{ vars.ZULIP_EMAIL }}
          organization-url: "https://leanprover.zulipchat.com"
          type: stream
          to: nightly-testing-cslib
          topic: downstream-lean4 PRs
          content: >
            PR cslib#${{ steps.export-pr.outputs.number }} with
            [downstream-lean4](https://github.com/leanprover/downstream-lean4)
            adaptations for `${{ steps.toolchain.outputs.toolchain }}` has just
            been opened. Please review the changes. No new adaptation PRs will
            be opened while this PR is still open.
